name: Test connessione MISE

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Controllo - connessione generica (google.com)
        run: curl -sS -m 20 -o /dev/null -w "HTTP %{http_code}\n" https://www.google.com || echo "FALLITO (exit $?)"

      - name: MISE - curl dettagliato (anagrafica)
        run: |
          curl -sS -v -m 25 -o /dev/null -w "\nHTTP %{http_code}  ip=%{remote_ip}  tempo=%{time_total}s\n" \
            https://www.mise.gov.it/images/exportCSV/anagrafica_impianti_attivi.csv 2>&1 | tail -25 || echo "FALLITO (exit $?)"

      - name: MISE - Node fetch con causa dell'errore
        run: |
          node -e "
          fetch('https://www.mise.gov.it/images/exportCSV/anagrafica_impianti_attivi.csv', { signal: AbortSignal.timeout(25000) })
            .then(r => console.log('HTTP', r.status))
            .catch(e => { console.log('ERRORE:', e.message); console.log('CAUSA:', e.cause && (e.cause.code + ' - ' + e.cause.message)); });
          "
